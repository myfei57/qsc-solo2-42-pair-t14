<button onclick="op('/api/guide/open')">guide open</button>
<button onclick="op('/api/cooling/open')">cooling open</button>
<button onclick="op('/api/runner/start')">runner start</button>
<button onclick="op('/api/gov/sync')">sync confirm</button>
<button onclick="op('/api/exc/apply')">excitation apply</button>
<button onclick="op('/api/brake/engage')">brake engage</button>
<div id="result"></div>
<script>
function op(path) {
  fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({unit_id: 'u1'})
  }).then(function (r) { return r.json(); }).then(function (data) {
    document.getElementById('result').textContent = JSON.stringify(data);
  });
}
</script>
